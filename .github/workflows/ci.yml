name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-release:
    name: Check and release audit
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      SOURCE_DATE_EPOCH: "1704067200"

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Show toolchain
        shell: bash
        run: |
          python --version
          node --version

      - name: Run project checks
        shell: bash
        run: python tools/check_project.py

      - name: Build and verify release
        shell: bash
        run: |
          python tools/build_release.py --dist dist
          python tools/build_release.py --dist dist --verify-only
          cp dist/console-*.zip "$RUNNER_TEMP/console-first.zip"
          python tools/build_release.py --dist dist
          cmp "$RUNNER_TEMP/console-first.zip" dist/console-*.zip
          python tools/build_release.py --dist dist --verify-only
